name: PR Review

# Runs the read-only `reviewer` agent (.claude/agents/reviewer.md) on each PR
# and posts its findings as a single, updated PR comment. If the review has
# Critical or Should-fix findings, the `fix` job hands them to the
# `implementer` agent and pushes the result to the PR branch. A pre-push hook
# blocks that push unless typecheck, lint, and tests pass and no tests were
# deleted or skipped.
#
# The reviewing Claude runs in a job that can only read. Posting happens in a
# separate job that has pull-requests: write and never runs Claude. The fix job
# does hold a write token (it has to push), like claude.yml.
#
# Trust model: fork PRs are skipped, so every reviewed PR was pushed by someone
# with write access. That's why the PR's own reviewer.md and CLAUDE.md are used
# as-is and the review is posted unsanitised: an author who could steer them
# could already edit this workflow or comment directly. The same holds for the
# fix job, which runs npm scripts from the PR branch.
#
# Fix loop: the fix commit is pushed with the Claude GitHub App token, so it
# triggers this workflow again as claude[bot] (hence allowed_bots). The
# re-review either passes or feeds the next round. After MAX_FIX_ROUNDS
# consecutive fix commits it stops and says so in the review comment; any
# other commit on the branch resets the count.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  MAX_FIX_ROUNDS: 3
  FIX_COMMIT_PREFIX: Apply reviewer findings

jobs:
  review:
    # Skip drafts, and fork PRs (secrets aren't available to them).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A new push supersedes an in-flight review (and, through `needs`, its fix).
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.extract.outputs.review }}
      blocking: ${{ steps.extract.outputs.blocking }}
      fix_round: ${{ steps.rounds.outputs.fix_round }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run reviewer agent
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Workflow token instead of the Claude GitHub App token, so this job
          # stays read-only and needs no id-token permission.
          github_token: ${{ github.token }}
          # Also review pushes from Claude (the fix job below, and @claude in
          # claude.yml). The action refuses bot actors by default, and both only
          # act on same-repo PRs, so this stays within the trust model above.
          allowed_bots: claude
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Get the diff with `gh pr diff ${{ github.event.pull_request.number }}` (the checkout is shallow, so don't diff against main).
            The PR's files are checked out in the working directory; read them for context.
            Reply with only the review in the Critical / Should-fix / Nitpick format. Don't post it anywhere; a later step does that.
          claude_args: |
            --agent reviewer
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

      - name: Extract review text
        id: extract
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          review="$(jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$EXECUTION_FILE")"
          if [ -z "$review" ]; then
            echo "::error::Reviewer produced no result (likely hit --max-turns). See the step log above."
            exit 1
          fi
          delim="REVIEW_$(openssl rand -hex 8)"
          { echo "review<<$delim"; printf '%s\n' "$review"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          # Blocking = any bullet other than "- none" under Critical or Should-fix.
          if printf '%s\n' "$review" | awk '
            /^##[[:space:]]/ { s = ($0 ~ /^##[[:space:]]+(Critical|Should-fix)/); next }
            s && /^[[:space:]]*[-*][[:space:]]/ && !/^[[:space:]]*[-*][[:space:]]+[Nn]one\.?[[:space:]]*$/ { found = 1 }
            END { exit !found }'; then
            echo "blocking=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocking=false" >> "$GITHUB_OUTPUT"
          fi

      # The round the next fix would be: 1 + consecutive fix commits at the
      # PR's tip. 0 means the limit is reached and no fix runs.
      - name: Count fix rounds
        id: rounds
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          done_rounds="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
            --jq '[.[] | .commit.message | startswith(env.FIX_COMMIT_PREFIX)] | reverse | (indices(false)[0] // length)')"
          if [ "$done_rounds" -ge "$MAX_FIX_ROUNDS" ]; then
            echo "fix_round=0" >> "$GITHUB_OUTPUT"
          else
            echo "fix_round=$((done_rounds + 1))" >> "$GITHUB_OUTPUT"
          fi

  comment:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update review comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW: ${{ needs.review.outputs.review }}
          BLOCKING: ${{ needs.review.outputs.blocking }}
          FIX_ROUND: ${{ needs.review.outputs.fix_round }}
        run: |
          set -euo pipefail
          marker='<!-- claude-pr-review -->'
          {
            echo "$marker"
            echo '## Claude review'
            echo
            printf '%s\n' "$REVIEW"
            echo
            echo '---'
            echo "_\`reviewer\` agent on ${{ github.event.pull_request.head.sha }}_"
            if [ "$BLOCKING" = "true" ] && [ "$FIX_ROUND" = "0" ]; then
              echo
              echo "_Auto-fix stopped after $MAX_FIX_ROUNDS rounds. Fix the findings above by hand or with \`@claude\`._"
            elif [ "$BLOCKING" = "true" ]; then
              echo
              echo "_Auto-fix round $FIX_ROUND of $MAX_FIX_ROUNDS: \`implementer\` is applying the Critical and Should-fix findings._"
            fi
          } > review.md
          # Update this workflow's previous comment (found by marker) instead of stacking new ones.
          id="$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | tail -n1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@review.md >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file review.md
          fi

  fix:
    needs: review
    # Same-repo check repeated as a guard; review already skips forks.
    if: >-
      needs.review.outputs.blocking == 'true' &&
      needs.review.outputs.fix_round != '0' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not cancelled by newer pushes: its own push starts the next run. If the
    # branch moved meanwhile, its push is rejected as non-fast-forward.
    concurrency:
      group: pr-fix-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push the fix commit
      id-token: write # Claude GitHub App token exchange; its pushes trigger re-review
    steps:
      # Exactly the reviewed commit, so the findings' file:line references match.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # From the PR's own lockfile. implementer runs typecheck and lint.
      - name: Install dependencies
        run: npm ci

      # Gate the fix push on a green build, whatever the session did or
      # skipped. The hook lives outside the checkout, so the session (which can
      # only write src/ and run the exact push command, no --no-verify) can't
      # edit or bypass it. Since the session can edit tests, the hook also
      # refuses a fix that deletes test files or test cases, or skips or
      # focuses tests, which would otherwise turn the test run green. It can't
      # catch a test whose assertions were weakened; review still has to. A
      # refusal is recorded in a marker file for the report step, and cleared
      # when a later push passes. The diff against the reviewed SHA relies on
      # checkout's ref being that SHA (it is the only commit fetched).
      - name: Require checks before pushing
        env:
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          hooks="$RUNNER_TEMP/git-hooks"
          mkdir -p "$hooks"
          {
            echo '#!/usr/bin/env bash'
            printf "reviewed='%s'\nmarker='%s'\n" "$REVIEWED_SHA" "$RUNNER_TEMP/pre-push-refused"
            cat <<'HOOK'
          set -euo pipefail
          refuse() {
            echo "pre-push: $1, push refused" >&2
            echo "$1" >> "$marker"
            exit 1
          }
          tests=(-- '*.test.ts' '*.test.tsx')
          if [ -n "$(git diff --name-only --diff-filter=D "$reviewed" HEAD "${tests[@]}")" ]; then
            refuse "the fix deletes test files"
          fi
          test_diff="$(git diff -U0 "$reviewed" HEAD "${tests[@]}")"
          if grep -E '^\+[^+].*(\b(describe|it|test)\.(skip|skipIf|runIf|only|todo|fails)\b|\bx(describe|it|test)\()' \
            <<<"$test_diff" >/dev/null; then
            refuse "the fix skips or focuses tests"
          fi
          # Test cases are it(...) / test(...) calls, including .each; a fix may move them but not drop them.
          removed="$(grep -cE '^-\s*(it|test)\b[^(]*\(' <<<"$test_diff" || true)"
          added="$(grep -cE '^\+\s*(it|test)\b[^(]*\(' <<<"$test_diff" || true)"
          if [ "$removed" -gt "$added" ]; then
            refuse "the fix removes test cases ($removed removed, $added added)"
          fi
          echo "pre-push: running typecheck, lint, and tests" >&2
          { npm run typecheck && npm run lint && npm run test; } >&2 || refuse "typecheck, lint, or tests failed"
          # A retry that passes lands the fix, so an earlier refusal no longer applies.
          rm -f "$marker"
          HOOK
          } > "$hooks/pre-push"
          chmod +x "$hooks/pre-push"
          git config core.hooksPath "$hooks"

      - name: Apply reviewer findings
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Subagents run in the background by default (Claude Code 2.1.198+).
          # This session only delegates, so it would end right after starting
          # implementer, killing it before it edits anything: the job then ends
          # green with nothing committed. Keep subagents in the foreground.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This job runs as claude[bot] when re-triggered by its own fix commit.
          allowed_bots: claude
          prompt: |
            The `reviewer` agent reviewed PR #${{ github.event.pull_request.number }} at commit ${{ github.event.pull_request.head.sha }}, which is checked out. Its review:

            <review>
            ${{ needs.review.outputs.review }}
            </review>

            Fix the Critical and Should-fix findings. Ignore Nitpicks.
            1. Run the `implementer` subagent in the foreground and wait for its report before step 2. Spec: "Fix these reviewer findings on an existing PR:" followed by the Critical and Should-fix sections copied verbatim. Don't paraphrase them.
            2. Check `git status --porcelain` and `git diff`. If nothing changed, stop and explain why.
            3. Run `npm run typecheck`, `npm run lint`, and `npm run test`. If any fail, run `implementer` again in the foreground with the failures and their error output, and tell it to fix the code or update tests whose expectations the fix intentionally changed. Don't delete, skip, or focus tests, or remove test cases, to make them pass; the pre-push hook refuses that. Repeat at most twice. If anything still fails, stop and report the failures without committing.
            4. Run `git add -A`, then commit with exactly this subject line: `${{ env.FIX_COMMIT_PREFIX }} (round ${{ needs.review.outputs.fix_round }})`. In the body, list the findings fixed and any not fixed, with implementer's reason.
            5. Push with exactly `git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}`. A pre-push hook runs typecheck, lint, and tests and checks that no tests were deleted, removed, or skipped. If it refuses the push, stop and report its failures; don't retry. If the push is rejected because the branch moved, stop: the new commits get their own review.
            Don't run the reviewer yourself; the push triggers a fresh review of the PR.
          # --agent isn't used, for the same reason as in claude.yml. The push
          # rule is the exact command, so no force-push or other branches.
          # Edit and Write are listed even though this session only delegates:
          # implementer's tool calls are checked against this allowlist, and in
          # CI anything not on it is denied. Without them implementer can't
          # change a file and the job ends green with nothing committed. They
          # are scoped to src/ (implementer's remit) because the review text in
          # the prompt is model output derived from PR content, so the session
          # must not be able to write workflows or agent definitions.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Edit(src/**),Write(src/**),Glob,Grep,Agent(implementer),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run test),Bash(git status:*),Bash(git diff:*),Bash(git add -A),Bash(git commit:*),Bash(git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }})"
            --disallowedTools "Agent(browser-verifier),Agent(pipeline),Agent(reviewer)"

      # The action exits 0 even when Claude made no commit (a denied tool, or a
      # finding it decided not to fix), which reads as a green run that did
      # nothing. Flag that, with Claude's own explanation. The action also
      # skips itself, writing no execution file, on a PR that changes a workflow
      # file (it requires them to match the default branch), so the file is
      # optional here.
      - name: Report if the fix wasn't pushed
        env:
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Fail the job when a fix was held back, so it never passes as a green
          # run that did nothing: the pre-push hook refused it (the marker file
          # says why, even if the branch has moved since), or the session
          # committed and stopped before pushing. A push rejected only because
          # the branch moved stays green: the new commits get their own review.
          marker="$RUNNER_TEMP/pre-push-refused"
          reason=""
          if [ -f "$marker" ]; then
            reason="The pre-push hook refused it: $(sort -u "$marker" | paste -sd ';' - | sed 's/;/; /g')."
          elif [ "$(git rev-parse HEAD)" != "$REVIEWED_SHA" ] &&
            [ "$(gh api "repos/$GH_REPO/git/ref/heads/$HEAD_REF" --jq .object.sha)" = "$REVIEWED_SHA" ]; then
            reason="The session committed a fix but stopped before pushing it."
          fi
          if [ -n "$reason" ]; then
            echo "::error::Auto-fix wasn't pushed. $reason"
            {
              echo '### Auto-fix not pushed'
              echo
              echo "$reason See the \"Apply reviewer findings\" step log, and fix the findings by hand or with \`@claude\`."
              if [ -f "${EXECUTION_FILE:-}" ]; then
                echo
                jq -r '[.[] | select(.type == "result")] | last | .result // "Claude returned no result message."' "$EXECUTION_FILE"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$REVIEWED_SHA" ]; then
            echo "::warning::Auto-fix made no commit on top of $REVIEWED_SHA. See the job summary."
            {
              echo '### Auto-fix made no commit'
              echo
              if [ -f "${EXECUTION_FILE:-}" ]; then
                jq -r '[.[] | select(.type == "result")] | last | .result // "Claude returned no result message."' "$EXECUTION_FILE"
              else
                echo "Claude did not run: the action wrote no output. It skips itself on PRs that change a workflow file. Check the \"Apply reviewer findings\" step log."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
